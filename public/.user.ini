; PHP runtime limits for the public web root.
; Read by PHP-FPM / LiteSpeed lsphp on cPanel (changes can take a few minutes
; to apply due to user_ini caching). On local XAMPP (mod_php) this file is
; ignored — set the same values in C:\xampp\php\php.ini for local testing.
;
; upload_max_filesize = per-image cap. post_max_size = whole-request cap, so it
; must be large enough for MULTIPLE images at once (their combined size), or the
; multi-upload POST is discarded by PHP and looks like a "session expired" error.
upload_max_filesize = 52M
post_max_size = 210M
memory_limit = 768M
max_file_uploads = 30
max_execution_time = 300
