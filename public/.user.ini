; PHP runtime limits for the public web root.
; Read by PHP-FPM / LiteSpeed lsphp on cPanel (changes can take a few minutes
; to apply due to user_ini caching). On local XAMPP (mod_php) this file is
; ignored — XAMPP's php.ini already allows large uploads.
upload_max_filesize = 32M
post_max_size = 40M
memory_limit = 768M
max_file_uploads = 20
max_execution_time = 180
